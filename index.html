<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLAYFORJA - Forjá tu leyenda</title>
<style>
:root{
  --bg:#0a0a0a; --panel:#141210; --panel2:#1b1712; --gold:#d9a441; --gold2:#f5d47a;
  --txt:#e8e2d5; --dim:#9a917f; --fire:#ff7a1a; --green:#8bc34a; --red:#e05545;
  --border:#3a2f1c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
a{color:var(--gold2);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* NAV */
header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(6px)}
.nav{display:flex;align-items:center;gap:18px;padding:10px 16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;letter-spacing:2px;color:var(--gold2);cursor:pointer}
.logo svg{width:30px;height:30px}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav-links button{background:none;color:var(--dim);padding:8px 12px;border-radius:8px;font-size:.9rem;font-weight:600}
.nav-links button:hover{color:var(--gold2)}
.nav-links button.active{color:var(--gold2);border-bottom:2px solid var(--gold)}
.btn-gold{background:linear-gradient(180deg,#f0c869,#c8922e);color:#1a1206;font-weight:700;padding:8px 16px;border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.btn-gold:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;border:1px solid var(--gold);color:var(--gold2);padding:8px 16px;border-radius:8px;font-weight:700}

/* HERO */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;padding:36px 0;align-items:center}
.hero h1{font-size:3.4rem;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,#ffe9b0,#c8922e);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.hero .tag{color:var(--gold2);font-style:italic;font-size:1.4rem;margin:8px 0 20px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{display:flex;justify-content:center}
.shield{width:220px;height:220px;filter:drop-shadow(0 0 30px rgba(255,122,26,.35));animation:flick 3s infinite alternate}
@keyframes flick{from{filter:drop-shadow(0 0 18px rgba(255,122,26,.25))}to{filter:drop-shadow(0 0 34px rgba(255,122,26,.5))}}

/* SECTIONS */
section{padding:26px 0}
h2.sec{color:var(--gold2);font-size:1.5rem;margin-bottom:4px;text-align:center}
p.sub{color:var(--dim);text-align:center;margin-bottom:18px;font-size:.95rem}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:var(--panel);color:var(--dim);padding:8px 18px;border-radius:8px;font-weight:700}
.tabs button.active{background:linear-gradient(180deg,#f0c869,#c8922e);color:#1a1206}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:12px;padding:14px;transition:.2s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card h3{color:var(--gold2);font-size:1.05rem;margin-bottom:6px}
.card .meta{color:var(--dim);font-size:.82rem;line-height:1.5}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:6px}
.b-movil{background:#2a3a1a;color:#a7d34a}.b-pc{background:#1a2a3a;color:#5aa7d3}
.btn-sm{background:linear-gradient(180deg,#f0c869,#c8922e);color:#1a1206;font-weight:800;font-size:.78rem;padding:6px 14px;border-radius:6px;margin-top:8px}
.btn-sm:disabled{background:#3a3325;color:#8a7f66;cursor:default}
.joinrow{display:flex;justify-content:space-between;align-items:flex-end}
.slots{color:var(--dim);font-size:.8rem;margin-top:6px}

/* RANKS */
.ranks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.rank{text-align:center;cursor:pointer;padding:10px 14px;border-radius:10px;border:1px solid transparent}
.rank.sel{border-color:var(--gold);background:var(--panel2)}
.rank svg{width:52px;height:52px}
.rank .nm{font-size:.8rem;font-weight:700;margin-top:4px}
.progressbar{background:#241d10;border:1px solid var(--border);border-radius:99px;height:16px;overflow:hidden;max-width:640px;margin:10px auto}
.progressbar>div{height:100%;background:linear-gradient(90deg,#c8922e,#ffe9b0);transition:width .5s}
.mission{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.mission:last-child{border:none}
.mission .done{color:var(--green)}

/* MAP */
.mapbox{background:radial-gradient(ellipse at center,#161310 0%,#0a0a0a 75%);border:1px solid var(--border);border-radius:14px;padding:14px}
.mapbox svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.pin:hover circle{fill:#ffe9b0}
.mapinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.mapinfo .card{text-align:center}

/* LANG */
.langgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:0 auto}
.langbtn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);color:var(--txt);padding:12px 14px;border-radius:10px;font-weight:700;font-size:1rem}
.langbtn:hover{border-color:var(--gold)}
.langbtn.sel{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 12px rgba(217,164,65,.3)}
.flag{width:28px;height:20px;border-radius:4px;display:inline-block;border:1px solid #000}

/* AUTH */
.authbox{max-width:400px;margin:30px auto;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:26px}
.authbox h2{color:var(--gold2);text-align:center;margin-bottom:16px}
.authbox input{width:100%;background:#0d0b08;border:1px solid var(--border);color:var(--txt);padding:11px;border-radius:8px;margin-bottom:12px;font-size:.95rem}
.authbox input:focus{outline:none;border-color:var(--gold)}
.authbox .switch{color:var(--dim);text-align:center;font-size:.85rem;margin-top:10px}
.authbox .switch a{cursor:pointer;font-weight:700}
.err{color:var(--red);font-size:.85rem;margin-bottom:8px;text-align:center}
.ok{color:var(--green);font-size:.85rem;margin-bottom:8px;text-align:center}
.userchip{display:flex;align-items:center;gap:8px;color:var(--gold2);font-weight:700;font-size:.85rem}
.userchip button{background:none;color:var(--dim);font-size:.78rem;text-decoration:underline}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:24px;max-width:440px;width:100%}
.modal h3{color:var(--gold2);margin-bottom:14px}
.modal input,.modal select{width:100%;background:#0d0b08;border:1px solid var(--border);color:var(--txt);padding:10px;border-radius:8px;margin-bottom:10px;font-size:.9rem}
footer{border-top:1px solid var(--border);margin-top:30px;padding:20px 0;color:var(--dim);font-size:.85rem}
footer .frow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;max-width:1280px;margin:0 auto;padding:0 16px}
.evid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.evid .card{min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,#241a10,#141210)}
.season{border:1px solid var(--gold);border-radius:12px;padding:16px;background:linear-gradient(160deg,#1c150c,#12100c)}
.season .st{font-weight:800;font-size:1.1rem;color:var(--gold2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#f0c869,#c8922e);color:#1a1206;font-weight:700;padding:10px 22px;border-radius:99px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:900px){.hero{grid-template-columns:1fr}.g3,.g4,.evid,.mapinfo{grid-template-columns:1fr 1fr}.langgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g3,.g4,.evid,.mapinfo,.langgrid{grid-template-columns:1fr}.hero h1{font-size:2.4rem}}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo" onclick="go('inicio')">
      <svg viewBox="0 0 64 64"><path d="M32 4 L40 18 L56 20 L44 32 L48 50 L32 42 L16 50 L20 32 L8 20 L24 18 Z" fill="#d9a441"/><path d="M26 34 h12 v6 h-12 z" fill="#1a1206"/><path d="M30 26 h4 v12 h-4 z" fill="#1a1206"/></svg>

<script>
/* ================== DATOS / BASE DE DATOS LOCAL ================== */
const DB_KEY='playforja_db_v1';
function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||defDB()}catch(e){return defDB()}}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function defDB(){return {users:{},session:null,lang:'es-AR',joined:{},tournaments:[],claims:{},progress:{}}}
let db=loadDB(); saveDB();

const LANGS=[
 {id:'es-AR',nm:'Español Argentino',flag:'linear-gradient(180deg,#74acdf 33%,#fff 33%,#fff 66%,#74acdf 66%)'},
 {id:'pt',nm:'Português',flag:'linear-gradient(180deg,#009b3a 50%,#ffdf00 50%)'},
 {id:'en',nm:'English',flag:'repeating-linear-gradient(180deg,#b22234 0 3px,#fff 3px 6px)'},
 {id:'fr',nm:'Français',flag:'linear-gradient(90deg,#0055a4 33%,#fff 33%,#fff 66%,#ef4135 66%)'},
 {id:'de',nm:'Deutsch',flag:'linear-gradient(180deg,#000 33%,#dd0000 33%,#dd0000 66%,#ffce00 66%)'},
 {id:'ja',nm:'日本語',flag:'radial-gradient(circle at center,#bc002d 30%,#fff 32%)'},

 {id:'ko',nm:'한국어',flag:'linear-gradient(180deg,#fff 50%,#cd2e3a 50%)'}
];
const T={
 'es-AR':{play:'Jugá 5 partidas',win:'Ganá 3',top:'Llegá a Top 3',join:'UNIRSE',joined:'ANOTADO',cancel:'CANCELAR',claim:'RECLAMAR',claimed:'RECLAMADO',login:'Entrar',reg:'Crear cuenta',logout:'Salir'},

 'en':{play:'Play 5 matches',win:'Win 3',top:'Reach Top 3',join:'JOIN',joined:'JOINED',cancel:'CANCEL',claim:'CLAIM',claimed:'CLAIMED',login:'Log in',reg:'Create account',logout:'Log out'},

 'de':{play:'Spiele 5 Runden',win:'Gewinne 3',top:'Erreiche Top 3',join:'BEITRETEN',joined:'ANGEMELDET',cancel:'ABBRECHEN',claim:'ABHOLEN',claimed:'ABGEHOLT',login:'Anmelden',reg:'Konto erstellen',logout:'Abmelden'},
 'ja':{play:'5試合プレイ',win:'3勝する',top:'トップ3に入る',join:'参加',joined:'参加済み',cancel:'キャンセル',claim:'受け取る',claimed:'受取済み',login:'ログイン',reg:'アカウント作成',logout:'ログアウト'},
 'ko':{play:'5경기 플레이',win:'3승',top:'탑3 달성',join:'참가',joined:'참가됨',cancel:'취소',claim:'수령',claimed:'수령됨',login:'로그인',reg:'계정 만들기',logout:'로그아웃'}
};
const t=k=>(T[db.lang]||T['es-AR'])[k];

const RANKS=[
 {nm:'Bronce',c:'#a5623a',xp:0},{nm:'Plata',c:'#b8bcc2',xp:200},{nm:'Oro',c:'#d9a441',xp:500},
 {nm:'Platino',c:'#e8f2f5',xp:900},{nm:'Diamante',c:'#6fd3f2',xp:1400},{nm:'Leyenda',c:'#ffd700',xp:2000}
];
const MISSIONS={
 daily:[{id:'d1',d:'Completá 3 partidas',xp:50},{id:'d2',d:'Ganá 1 ronda sin morir',xp:30},{id:'d3',d:'Reclamá recompensa diaria',xp:0,cofre:'Cofre Bronce'}],
 weekly:[{id:'w1',d:'Alcanzá 5 victorias PvP',xp:200},{id:'w2',d:'Completá 10 objetivos en equipo',xp:150},{id:'w3',d:'Reclamá el domingo',xp:0,cofre:'Cofre Plata'}],
 season:[{id:'s1',d:'Lográ 25k de puntos estacionales',xp:1000},{id:'s2',d:'Desbloqueá 3 logros épicos',xp:500},{id:'s3',d:'Temporada 04: Reclamá cofre Platino',xp:0,cofre:'Cofre Platino'}]
};
const REGIONS=[
 {id:'buenosaires',nm:'Buenos Aires',pais:'Argentina',zona:'LATAM',ping:28,x:246,y:428},
 {id:'saopaulo',nm:'São Paulo',pais:'Brasil',zona:'LATAM',ping:32,x:300,y:418},
 {id:'santiago',nm:'Santiago',pais:'Chile',zona:'LATAM',ping:30,x:226,y:438},
 {id:'cdmx',nm:'CDMX',pais:'México',zona:'LATAM',ping:35,x:170,y:300},
 {id:'usa',nm:'Miami',pais:'USA',zona:'NA / EU',ping:120,x:230,y:250},
 {id:'espana',nm:'Madrid',pais:'España',zona:'NA / EU',ping:180,x:470,y:238},
 {id:'francia',nm:'París',pais:'Francia',zona:'NA / EU',ping:185,x:492,y:222},
 {id:'japon',nm:'Tokio',pais:'Japón',zona:'APAC',ping:250,x:806,y:262}
];
let page='inicio';

/* ================== ICONOS SVG ================== */
const I={
 fire:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#ff7a1a"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-2-1-3-1-3 3 1 5 4 5 7a7 7 0 01-14 0c0-6 6-8 7-13z"/></svg>',
 moon:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#b8bcc2"><path d="M21 13a9 9 0 11-10-11 7 7 0 0010 11z"/></svg>',
 trophy:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#d9a441"><path d="M6 3h12v2h3v3a4 4 0 01-4 4 6 6 0 01-4 4v3h3v2H8v-2h3v-3a6 6 0 01-4-4 4 4 0 01-4-4V5h3V3zm-2 4v1a2 2 0 002 2V7H4zm16 0h-2v3a2 2 0 002-2V7z"/></svg>',
 map:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#d9a441"><path d="M9 3l6 2 6-2v16l-6 2-6-2-6 2V5l6-2zm0 2.2L5 6.3v12.4l4-1.3V5.2zm2 .1v12.2l4 1.3V6.6l-4-1.3z"/></svg>',
 lang:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#d9a441"><circle cx="12" cy="12" r="9" fill="none" stroke="#d9a441" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#d9a441" stroke-width="2"/></svg>',
 shield:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#d9a441"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z"/></svg>',
 crown:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#ffd700"><path d="M3 7l4 4 5-6 5 6 4-4v10H3V7z"/></svg>',
 gem:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#6fd3f2"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/></svg>',
 tv:'<svg viewBox="0 0 24 24" width="20" height="20" fill="#d9a441"><path d="M3 5h18v12H3V5zm5 14h8v2H8v-2z"/></svg>',
 dl:'<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M11 3h2v8l3-3 1.5 1.5L12 15 6.5 9.5 8 8l3 3V3zM5 19h14v2H5v-2z"/></svg>',
 coin:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#ffd700"><circle cx="12" cy="12" r="9"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="#1a1206" font-weight="bold">PF</text></svg>',
 check:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#8bc34a"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>',
 chest:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#d9a441"><path d="M4 8a4 4 0 014-4h8a4 4 0 014 4v2H4V8zm0 4h9v2h-2v4H4v-6zm11 2h5v4h-7v-4h2z"/></svg>'
};
function rankSVG(r,i){return `<svg viewBox="0 0 64 64"><defs><linearGradient id="rg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="${r.c}"/></linearGradient></defs><path d="M32 4 L56 12 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V12 Z" fill="url(#rg${i})" stroke="${r.c}" stroke-width="2"/></svg>`}

/* ================== NAVEGACIÓN ================== */
const NAV=[['inicio','Inicio'],['torneos','Torneos'],['salas','Salas'],['misiones','Misiones'],['marcos','Marcos'],['temporadas','Temporadas'],['streaming','Streaming'],['idiomas','Idiomas'],['mapa','Maps'],['evidencia','Evidencia']];
function renderNav(){
  document.getElementById('navlinks').innerHTML=NAV.map(([id,nm])=>
   `<button class="${page===id?'active':''}" onclick="go('${id}')">${nm}</button>`).join('');
  const a=document.getElementById('autharea');
  if(db.session){const u=db.users[db.session];
    a.innerHTML=`<div class="userchip">${I.coin} ${u.nick} · ${u.pf} PF <button onclick="logout()">${t('logout')}</button></div>`;
  } else {
    a.innerHTML=`<button class="btn-gold" onclick="go('cuenta')">${t('login')} / ${t('reg')}</button>`;
  }
}
function go(p){page=p;renderNav();render();window.scrollTo(0,0)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}

/* ================== AUTENTICACIÓN (cuenta propia) ================== */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
function renderAuth(){
  if(db.session){go('inicio');return}
  app.innerHTML=`
  <div class="authbox">
    <h2>${I.shield} PLAYFORJA</h2>
    <div id="authmsg"></div>
    <input id="auser" placeholder="Nombre de usuario" autocomplete="off"/>
    <input id="apass" type="password" placeholder="Contraseña"/>
    <button class="btn-gold" style="width:100%;justify-content:center" onclick="doReg()">${t('reg')}</button>
    <div class="switch">¿Ya tenés cuenta? <a onclick="go('login')">Entrar acá</a></div>
    <p class="sub" style="margin-top:14px">Cuenta propia de PLAYFORJA. Tus datos quedan guardados en este dispositivo. Sin Google ni redes.</p>
  </div>`;
}
function doReg(){
  const u=document.getElementById('auser').value.trim(), p=document.getElementById('apass').value;
  const m=document.getElementById('authmsg');
  if(u.length<3) return m.innerHTML='<div class="err">El usuario necesita al menos 3 caracteres.</div>';
  if(p.length<4) return m.innerHTML='<div class="err">La contraseña necesita al menos 4 caracteres.</div>';
  if(db.users[u.toLowerCase()]) return m.innerHTML='<div class="err">Ese usuario ya existe. Elegí otro.</div>';
  db.users[u.toLowerCase()]={nick:u,pass:hash(p),pf:1200,xp:0,wins:0,created:Date.now()};
  db.session=u.toLowerCase(); saveDB(); toast('¡Cuenta creada! Bienvenido a la Forja, '+u); go('inicio');
}
function doLogin(){
  const u=document.getElementById('auser').value.trim().toLowerCase(), p=document.getElementById('apass').value;
  const m=document.getElementById('authmsg');
  const acc=db.users[u];
  if(!acc||acc.pass!==hash(p)) return m.innerHTML='<div class="err">Usuario o contraseña incorrectos.</div>';
  db.session=u; saveDB(); toast('Bienvenido de nuevo, '+acc.nick); go('inicio');
}
function logout(){db.session=null;saveDB();go('inicio');toast('Sesión cerrada')}

/* ================== PÁGINAS ================== */
const app=document.getElementById('app');

function heroSection(){
  return `<section class="hero">
    <div>
      <h1>PLAYFORJA</h1>

function addXP(n){
  if(!db.session)return; const u=db.users[db.session]; u.xp+=n;
  while(u.xp>=(RANKS[Math.min(RANKS.findIndex(r=>r.nm===u.rank||0)+1,5)]||{xp:Infinity}).xp){}
  let ri=0; RANKS.forEach((r,i)=>{if(u.xp>=r.xp)ri=i});
  const prev=u.rank; u.rank=RANKS[ri].nm;
  if(prev&&prev!==u.rank)toast('¡Subiste a rango '+u.rank+'!');
}
function claimMission(type,id,xp,cofre){
  if(!db.session){toast('Iniciá sesión para reclamar misiones');go('cuenta');return}
  const key=type+':'+id;
  if(db.claims[key]){toast('Ya reclamaste esta misión');return}
  db.claims[key]=true;
  if(xp)addXP(xp);
  if(cofre){const u=db.users[db.session];u.pf+=250;toast('¡'+cofre+' reclamado! +250 PF')}
  else toast('+'+xp+' XP');
  saveDB(); render();
}
